apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow
  labels:
    app: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow
  template:
    metadata:
      labels:
        app: taskflow
    spec:
      containers:
        - name: taskflow
          image: DOCKERHUB_USERNAME/taskflow:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: secret-key
            - name: DATABASE_URL
              value: sqlite:////app/instance/taskflow.db
          volumeMounts:
            - name: taskflow-data
              mountPath: /app/instance
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: taskflow-data
          persistentVolumeClaim:
            claimName: taskflow-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taskflow-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow
spec:
  type: NodePort
  selector:
    app: taskflow
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
